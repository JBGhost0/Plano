[workspace]
resolver = "2"
members = [
    "crates/plano-core",
    "crates/plano-engine",
    "crates/plano-store",
    "crates/plano-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
plano-core = { path = "crates/plano-core" }
plano-engine = { path = "crates/plano-engine" }
plano-store = { path = "crates/plano-store" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
